name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A merge queue tests each pull request merged on top of those ahead.
  merge_group:

permissions:
  contents: read

jobs:
  go:
    name: Go (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS too: its keys, its notch and its media controls, which
        # wait for the main thread, make tests that pass elsewhere fail.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Formatting
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      # Go's modules, again if a download breaks off. setup-go's cache has
      # them, unless go.sum changed.
      - name: Go's modules
        shell: bash
        run: bash .github/scripts/retry.sh 45 go mod download
      - name: Vet for Linux, Windows and macOS
        shell: bash
        run: |
          go vet ./...
          GOOS=linux go vet ./...
          GOOS=windows go vet ./...
          GOOS=darwin go vet ./...
      # The Opus decoder's conformance test decodes the test vectors of RFC
      # 8251. They never change: download them once, and check them.
      - name: Cache the Opus test vectors
        if: runner.os == 'Linux'
        id: opus-vectors
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/opus-vectors
          key: opus-testvectors-rfc8251
      - name: Download the Opus test vectors
        if: runner.os == 'Linux' && steps.opus-vectors.outputs.cache-hit != 'true'
        run: |
          curl -fsSL --retry 15 --retry-all-errors --retry-max-time 1800 -o "$RUNNER_TEMP/opus-vectors.tar.gz" https://opus-codec.org/static/testvectors/opus_testvectors-rfc8251.tar.gz
          echo "6b26a22f9ba87b2b836906a9bb7afec5f8e54d49553b1200382520ee6fedfa55  $RUNNER_TEMP/opus-vectors.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/opus-vectors"
          tar -xzf "$RUNNER_TEMP/opus-vectors.tar.gz" -C "$RUNNER_TEMP/opus-vectors"
      # The community plugins' JavaScript, which tests run, and the
      # registry check reads: main keeps their TypeScript only.
      - uses: oven-sh/setup-bun@v2
      - name: Compile the community plugins
        shell: bash
        run: |
          bash .github/scripts/retry.sh 45 bun install --frozen-lockfile
          bun run build:plugins
      # The romaji tests read the IPA dictionary, which the app downloads,
      # from its module, checked against go.sum: the app doesn't build it in.
      - name: Download the dictionary of the romaji tests
        shell: bash
        run: bash .github/scripts/retry.sh 45 go mod download github.com/ikawaha/kagome-dict/ipa@v1.2.6
      # tools/gotest runs a test that fails again, up to 3 more times: one
      # that passes then is reported as flaky, and one that fails every
      # time fails the step.
      - name: Test
        run: go run ./tools/gotest ./...
        env:
          OPUS_TESTVECTORS: ${{ runner.os == 'Linux' && format('{0}/opus-vectors/opus_newvectors', runner.temp) || '' }}
      # MixMusic takes keys MyGo has none for from its GTK window: these
      # press them in one, on a virtual display. A test that skips found no
      # display, GTK or xdotool: here, that fails.
      - name: Keys in a GTK window
        if: runner.os == 'Linux'
        shell: bash
        # apt-install.sh goes on from Ubuntu's own archive when the
        # runner's mirror is slow.
        timeout-minutes: 20
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: "1"
        run: |
          bash .github/scripts/apt-install.sh xvfb xdotool libgtk-3-0t64
          xvfb-run -a go test ./internal/keypad/ -run 'TestWatch|TestPlusPressed' -count=1 -v | tee keys.log
          if grep -q -- '--- SKIP' keys.log; then
            echo "A test skipped."
            exit 1
          fi
      - name: Community registry
        run: go run ./tools/registry -check
      - name: Changelog fragments
        run: go run ./tools/changelog -check

  # MixMusic's own audio engine plays through each system's audio output:
  # these play silence, and a track at volume 0, on Linux and macOS, whose
  # runners have no sound card: a PulseAudio null sink, which keeps time as
  # one does, and BlackHole, a virtual device, stand in for one.
  audio:
    name: Audio output (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A run takes about a minute; one that hangs gives up long before
    # GitHub's 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go's modules
        run: bash .github/scripts/retry.sh 45 go mod download
      # PulseAudio without what apt recommends with it, but for its pactl
      # and pacat; apt-install.sh goes on from Ubuntu's own archive when the
      # runner's mirror is slow.
      - name: A sound server
        if: runner.os == 'Linux'
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt-install.sh --no-install-recommends pulseaudio pulseaudio-utils
          pulseaudio --start --exit-idle-time=-1
          pactl info
      - name: An audio device
        if: runner.os == 'macOS'
        run: |
          bash .github/scripts/retry.sh 45 brew install --cask blackhole-2ch
          sudo killall coreaudiod || true
          sleep 5
          system_profiler SPAudioDataType
      # A test that skips found no device: here, that fails.
      - name: Play through the device
        shell: bash
        env:
          MIXMUSIC_AUDIO: "1"
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            # An idle null sink wakes every 2 seconds, and starts a new
            # stream at its next waking, as a sound card or PipeWire doesn't:
            # silence played at a low latency keeps it awake.
            pacat --latency-msec=10 --format=s16le --rate=48000 --channels=2 /dev/zero &
            sleep 2
          fi
          go run ./tools/gotest ./internal/audio/... -run 'TestStream|TestStartStop|TestRenderPanic|TestEngineOnTheDevice' -count=1 -v | tee audio.log
          if grep -q -- '--- SKIP' audio.log; then
            echo "A test skipped: the runner has no audio device."
            exit 1
          fi
      # The engine shows what it plays in the system's media controls: an
      # MPRIS player that these call as a desktop does, on a session bus of
      # their own, on Linux, and Now Playing on macOS. On Linux, a portal
      # of the test's own answers the Flatpak's requests to run in the
      # background and start at login.
      - name: Show in the system's media controls
        shell: bash
        run: |
          bus=""
          if [ "$RUNNER_OS" = Linux ]; then
            bash .github/scripts/apt-install.sh dbus
            bus="dbus-run-session --"
          fi
          $bus go run ./tools/gotest ./internal/nowplaying/ ./internal/portal/ -run 'TestMPRIS|TestNowPlaying|TestBackgroundPortal' -count=1 -v | tee controls.log
          if grep -q -- '--- SKIP' controls.log; then
            echo "A test skipped."
            exit 1
          fi

  # The plugin API's types, and the community's plugins against them.
  sdk:
    name: Plugin SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bash .github/scripts/retry.sh 45 bun install --frozen-lockfile
      - run: bun run typecheck
      # The plugin API is written in TypeScript, and ships the JavaScript it
      # compiles to, which the Go side embeds: main keeps it, and it must be
      # what its TypeScript compiles to. The community plugins compile too,
      # into JavaScript the Registry workflow publishes, which main doesn't
      # keep.
      - name: The plugins compile, and api.js is what api.ts compiles to
        run: |
          bun run build:plugins
          if ! git diff --exit-code -- internal/plugins/api.js; then
            echo "Run bun run build:plugins, and commit internal/plugins/api.js" >&2
            exit 1
          fi

  # The website, as pages.yml builds it: the docs' pages made from
  # docs/*.md and the folders of docs with a README.md, which fails on a
  # link to a file the repository lacks, and
  # the site built with Zola, which fails on a broken link between them.
  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: nix develop --command go run ./tools/sitedocs
      - run: nix develop --command zola --root site build

  # The release's builds, in the Nix shell release.yml builds them in.
  build:
    name: Build ${{ matrix.platform }}
    needs: [go, sdk]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # linux/arm64 is for the Arm64 Flatpak, which packs its archive:
        # Windows on Arm builds in the release alone.
        platform: [windows/amd64, linux/amd64, linux/arm64, darwin/universal]
        # The archives the Flatpak jobs pack the app of.
        include:
          - { platform: linux/amd64, archive: linux-amd64 }
          - { platform: linux/arm64, archive: linux-arm64 }
    steps:
      - uses: actions/checkout@v7
      # The tools of flake.nix's shell, at the versions of flake.lock.
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      # Bun's and Go's packages, again if a download breaks off.
      - run: nix develop --command bash .github/scripts/retry.sh 45 bun install --frozen-lockfile
      - run: nix develop --command bash .github/scripts/retry.sh 45 go mod download
      - run: nix develop --command bash .github/scripts/build.sh "${{ matrix.platform }}"
      # Nix's own loader would keep it from starting outside NixOS (#166).
      - name: The Linux build asks for the system's loader
        if: startsWith(matrix.platform, 'linux/')
        run: nix develop --command go run ./tools/elfloader build/linux-*
      # release.yml finds the installer by this name.
      - name: The installer has the name the release looks for
        if: startsWith(matrix.platform, 'windows/')
        run: ls build/windows-*/*-setup-*.exe
      # The release makes these from the builds too: try it on every change.
      - name: Package the portable zip, the RPM and the AppImage
        if: ${{ !startsWith(matrix.platform, 'darwin/') }}
        run: |
          nix develop --command bash .github/scripts/package.sh "$(jq -r .version package.json)" packages
          ls -l packages
      # The Flatpak job of its architecture packs the app of this archive.
      - name: Keep the Linux archive for the Flatpak
        if: matrix.archive
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: build/${{ matrix.archive }}/mixmusic-*-${{ matrix.archive }}.tar.gz
          if-no-files-found: error
          retention-days: 3

  # The Flatpaks, as release.yml makes them, of the Linux builds above, in
  # Flathub's container with the GNOME runtime and flatpak-builder, on a
  # runner of each one's architecture: installed and started in their
  # sandbox. Linux users can try a change from their flatpak-<arch>
  # artifacts. The x64 job keeps the name it had.
  flatpak:
    name: Flatpak${{ matrix.arch == 'arm64' && ' (Arm64)' || '' }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, flatpak: x86_64, runner: ubuntu-latest }
          # Flathub's container is made for Arm64 too.
          - { arch: arm64, flatpak: aarch64, runner: ubuntu-24.04-arm }
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true # Flathub's shared modules
      # For the metadata's releases, which tools/metainfo writes.
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@v8
        with:
          name: linux-${{ matrix.arch }}
          path: linux
      - name: The app and its metadata
        run: |
          mkdir -p packaging/flatpak/dist
          cp linux/mixmusic-*-linux-${{ matrix.arch }}.tar.gz packaging/flatpak/dist/mixmusic-linux-${{ matrix.arch }}.tar.gz
          go run ./tools/metainfo -o packaging/flatpak/dist/io.github.fzn0x.mixmusic.metainfo.xml
          appstreamcli validate --no-net --explain packaging/flatpak/dist/io.github.fzn0x.mixmusic.metainfo.xml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6.8
        with:
          manifest-path: packaging/flatpak/io.github.fzn0x.mixmusic.yml
          bundle: mixmusic-linux-${{ matrix.arch }}.flatpak
          arch: ${{ matrix.flatpak }}
          branch: stable
          upload-artifact: false
      - name: Install it, and start MixMusic in its sandbox
        run: bash packaging/flatpak/check.sh mixmusic-linux-${{ matrix.arch }}.flatpak shots
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-${{ matrix.arch }}
          path: mixmusic-linux-${{ matrix.arch }}.flatpak
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: flatpak-screenshots-${{ matrix.arch }}
          path: shots/
          if-no-files-found: ignore

  # flake.nix: its lock, MixMusic for Linux built from source, and the
  # configuration GoReleaser publishes releases with.
  nix:
    name: Nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: flake.lock is committed, and locks every input
        run: |
          bash .github/scripts/nix-retry.sh nix flake lock
          if [ -n "$(git status --porcelain -- flake.lock)" ]; then
            cat flake.lock
            echo "flake.lock is missing or out of date: run nix flake lock" >&2
            exit 1
          fi
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: bash .github/scripts/nix-retry.sh nix flake check --print-build-logs
      - name: MixMusic for Linux, from source
        run: bash .github/scripts/nix-retry.sh nix build --print-build-logs
      - name: GoReleaser's configuration
        run: nix develop --command goreleaser check
