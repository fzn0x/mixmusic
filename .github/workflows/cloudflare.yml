name: Cloudflare

# Builds the site in site/ as pages.yml does, for its copy on Cloudflare at
# https://mixmusic.functionx.dev, and deploys it there as the Worker of
# site/wrangler.jsonc, which only serves the built files. Pull requests that
# change what the site is built from build it and check the Worker without
# deploying it, and keep the build as the site-cloudflare artifact. Pushes to
# main deploy it, with the repository's CLOUDFLARE_API_TOKEN and
# CLOUDFLARE_ACCOUNT_ID secrets.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/sitedocs/**"
      - "go.mod"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/cloudflare.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "tools/sitedocs/**"
      - "go.mod"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/cloudflare.yml"
  workflow_dispatch:

permissions:
  contents: read

# A pull request's newer push replaces its older run. Each push to main runs
# to its end, so that every commit on main shows how it went: one whose
# commit is no longer main's newest builds and deploys nothing, leaving
# that to the newer one's run. A shared concurrency group would have GitHub
# cancel the runs waiting in it, which shows as failed.
concurrency:
  group: cloudflare-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SITE_URL: https://mixmusic.functionx.dev
  WRANGLER_VERSION: 4.147.0

jobs:
  newest:
    name: Main's newest commit
    # Only a push can be behind a newer one.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - id: newest
        run: bash .github/scripts/newest.sh

  deploy:
    needs: newest
    # A pull request's run, or one started by hand, goes on without that
    # check.
    if: ${{ !cancelled() && needs.newest.result != 'failure' && needs.newest.outputs.newest != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Go and Zola, at the versions flake.lock pins.
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - name: The docs' pages, from docs/*.md
        run: nix develop --command go run ./tools/sitedocs
      - name: Build the site
        run: nix develop --command zola --root site build --base-url "$SITE_URL"
      # Crawlers read robots.txt only at a domain's root, which this copy
      # is and GitHub Pages' isn't: it names the sitemap Zola made.
      - name: robots.txt
        run: |
          printf 'User-agent: *\nAllow: /\n\nSitemap: %s/sitemap.xml\n' "$SITE_URL" > site/public/robots.txt
      # Wrangler, fetched once, again if the download breaks off: the
      # check and the deploy run it from npx's cache.
      - name: Wrangler
        working-directory: site
        run: bash ../.github/scripts/retry.sh 45 npx --yes "wrangler@$WRANGLER_VERSION" --version
      - name: Check the Worker
        working-directory: site
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy --dry-run
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-cloudflare
          path: site/public
          retention-days: 7
      # Main may have moved on while the site built.
      - id: still
        name: Still main's newest commit
        if: github.event_name != 'pull_request'
        run: bash .github/scripts/newest.sh
      - name: Deploy
        if: github.event_name != 'pull_request' && steps.still.outputs.newest == 'true'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::The CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets are missing (CONTRIBUTING.md, The website)."
            exit 1
          fi
          npx --yes "wrangler@$WRANGLER_VERSION" deploy
