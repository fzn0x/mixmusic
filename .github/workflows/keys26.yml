name: Keys on Ubuntu 26.04, temporary

# Temporary: the keypad's keys on Ubuntu 24.04 and 26.04 side by side, from
# the X server's keymap to GTK 3's window. Removed before the pull request
# is ready.

on:
  pull_request:

permissions:
  contents: read

jobs:
  keys:
    name: Keys (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Tools
        timeout-minutes: 15
        run: |
          libgtk=libgtk-3-0t64
          bash .github/scripts/apt-install.sh --no-install-recommends \
            xvfb xauth xdotool x11-utils x11-xkb-utils x11-xserver-utils xinput "$libgtk" python3-gi gir1.2-gtk-3.0
      - name: Evidence
        run: bash .github/keys26/evidence.sh keys26
      - name: Keys in a GTK window
        env:
          GDK_BACKEND: x11
          NO_AT_BRIDGE: "1"
        run: xvfb-run -a go test ./internal/keypad/ -run 'TestWatch|TestPlusPressed' -count=1 -v
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: keys26-${{ matrix.os }}
          path: keys26/
