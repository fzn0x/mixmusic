name: Linux app

# MixMusic started as Linux users start it, and checked from outside as a
# desktop sees it (#146): the build from flake.nix, and the release's
# linux/amd64 archive on plain Ubuntu, each on a virtual X display and a
# session bus of its own. .github/scripts/linux-app.py checks that it
# shows its window, registers its tray icon, answers the media keys and
# MPRIS, follows settings.json and colour files as they change, and zooms
# with Ctrl and the keypad's +. Its frames, logs and D-Bus answers are the
# jobs' artifacts. It isn't a required check: it reads the network, and
# the runner's display and sound server.

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - flake.nix
      - flake.lock
      - nix/**
      - package.json
      - bun.lock
      - mygo.config.ts
      - resources/**
      - brand/**
      - .github/scripts/**
      - .github/workflows/linux-app.yml

permissions:
  contents: read

# A pull request's newer push replaces its older run. Each push to main runs
# to its end, so that every commit on main shows how it went, rather than
# show as failed once the next push cancelled it.
concurrency:
  group: linux-app-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # `nix build`, as PR #133 has Linux users build MixMusic from source,
  # started on Ubuntu, outside NixOS, with Nix's libraries.
  #
  # A Nix build finds no OpenGL driver outside NixOS: its libglvnd looks in
  # /run/opengl-driver, which only NixOS has. MixMusic needs none here:
  # MyGo draws the windows on the CPU when the machine has no GPU device,
  # as runners have none, and MixMusic opens no WebKitGTK page until the
  # user signs in or watches a music video.
  nix:
    name: The Nix build
    runs-on: ubuntu-latest
    # A run takes about 4 minutes, more when apt's mirror is slow or a
    # download tries again; one that hangs gives up long before GitHub's 6
    # hours.
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: MixMusic, from source
        run: bash .github/scripts/nix-retry.sh nix build --print-build-logs
      # FFmpeg grabs the display's frames and makes the tone the checks
      # play. It comes from Nix's binary cache, in nixpkgs' full build, the
      # one with x11grab: from Ubuntu's archive its libraries were 74 MB,
      # which the runner's mirror once took more than 10 minutes for.
      - name: FFmpeg
        # nix-retry.sh tries again for up to 45 minutes.
        timeout-minutes: 50
        run: |
          bash .github/scripts/nix-retry.sh nix build --no-link --inputs-from . 'nixpkgs#ffmpeg-full^bin'
          ffmpeg="$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#ffmpeg-full^bin')"
          echo "$ffmpeg/bin" >> "$GITHUB_PATH"
          "$ffmpeg/bin/ffmpeg" -hide_banner -version | head -n 1
      # The tools alone, without what apt recommends with them. xauth (for
      # xvfb-run), the X fonts and PulseAudio's pactl, parec and pacat came
      # as recommendations, so they are named. apt-install.sh goes on from
      # Ubuntu's own archive when the runner's mirror is slow.
      - name: A display, a sound server, and the checks' tools
        timeout-minutes: 15
        run: |
          bash .github/scripts/apt-install.sh --no-install-recommends \
            xvfb xauth xfonts-base xdotool x11-utils dbus pulseaudio pulseaudio-utils python3-gi gir1.2-glib-2.0
          pulseaudio --start --exit-idle-time=-1
      - name: Start it, and check it
        run: |
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
            /usr/bin/python3 .github/scripts/linux-app.py --libs nix result/bin/mixmusic linux-app
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-app-nix
          path: linux-app/
          if-no-files-found: error

  # The linux/amd64 archive, built as release.yml builds it, started on
  # Ubuntu with the libraries the docs have users install: it asks for the
  # system's loader, not Nix's (#166).
  release:
    name: The release build on Ubuntu
    runs-on: ubuntu-latest
    # A run takes about 7 minutes, more when apt's mirror is slow or a
    # download tries again.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      # Bun's and Go's packages, again if a download breaks off.
      - run: nix develop --command bash .github/scripts/retry.sh 45 bun install --frozen-lockfile
      - run: nix develop --command bash .github/scripts/retry.sh 45 go mod download
      - run: nix develop --command bash .github/scripts/build.sh linux/amd64
      - name: Unpack the archive
        run: |
          mkdir app
          tar -xzf build/linux-amd64/mixmusic-*-linux-amd64.tar.gz -C app
          find app -type f | head -n 20
      # FFmpeg as the Nix build's job gets it.
      - name: FFmpeg
        timeout-minutes: 50
        run: |
          bash .github/scripts/nix-retry.sh nix build --no-link --inputs-from . 'nixpkgs#ffmpeg-full^bin'
          ffmpeg="$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#ffmpeg-full^bin')"
          echo "$ffmpeg/bin" >> "$GITHUB_PATH"
          "$ffmpeg/bin/ffmpeg" -hide_banner -version | head -n 1
      # docs/getting-started.md's line for Debian and Ubuntu.
      # The libraries as the docs' line installs them, with what apt
      # recommends; the checks' tools as the Nix build's job installs them.
      - name: The libraries the docs name, a display, a sound server, and the checks' tools
        timeout-minutes: 25
        run: |
          bash .github/scripts/apt-install.sh libgtk-3-0 libpulse0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libsecret-1-0
          bash .github/scripts/apt-install.sh --no-install-recommends \
            xvfb xauth xfonts-base xdotool x11-utils dbus pulseaudio pulseaudio-utils python3-gi gir1.2-glib-2.0
          pulseaudio --start --exit-idle-time=-1
      - name: Start it, and check it
        run: |
          app="$(find app -type f -name mixmusic -perm -u+x | head -n 1)"
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
            /usr/bin/python3 .github/scripts/linux-app.py --libs system "$app" linux-app
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: linux-app-release
          path: linux-app/
          if-no-files-found: error

  # The yt-dlp MixMusic installs on Linux, and how long it takes to start
  # (#245). yt-dlp_linux, the single file, unpacks Python into a new folder
  # at each start, as yt-dlp_macos did in 8 s, which made macOS install the
  # unpacked build (#250). On Linux it starts in under a second, about 0.4 s
  # more than yt-dlp_linux.zip unpacked, so Linux keeps the single file:
  # this fails if that changes.
  ytdlp:
    name: yt-dlp's start
    runs-on: ubuntu-latest
    # A run takes about a minute; its test and downloads may try again for
    # longer.
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Go's modules
        run: bash .github/scripts/retry.sh 45 go mod download
      # It downloads yt-dlp: tools/gotest runs it again when it fails, up to
      # 3 more times.
      - name: MixMusic installs yt-dlp, checks it, and runs it
        timeout-minutes: 45
        env:
          MIXMUSIC_LIVE: "1"
        run: go run ./tools/gotest ./internal/tools/ -run '^TestLiveInstall$' -count=1 -v
      - name: Time yt-dlp_linux and yt-dlp_linux.zip
        # Each download tries again for up to 30 minutes.
        timeout-minutes: 100
        run: |
          cd "$RUNNER_TEMP"
          url=https://github.com/yt-dlp/yt-dlp/releases/latest/download
          for f in SHA2-256SUMS yt-dlp_linux yt-dlp_linux.zip; do
            curl -fsSL --retry 15 --retry-all-errors --retry-max-time 1800 -o "$f" "$url/$f"
          done
          grep -E ' (yt-dlp_linux|yt-dlp_linux\.zip)$' SHA2-256SUMS | sha256sum -c -
          chmod +x yt-dlp_linux
          mkdir unpacked
          unzip -q yt-dlp_linux.zip -d unpacked
          find unpacked -maxdepth 1 | sort
          program="$(find unpacked -maxdepth 1 -type f -perm -u+x | head -n 1)"
          TIMEFORMAT=%R
          times() {
            sync
            echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
            for _ in 1 2 3 4 5 6; do { time "$1" --version >/dev/null; } 2>&1; done | paste -sd ' '
          }
          single="$(times ./yt-dlp_linux)"
          zipped="$(times "$program")"
          {
            echo "### yt-dlp $(./yt-dlp_linux --version) on ubuntu-latest: seconds to --version, the first after the page cache is dropped"
            echo
            echo "| Build | Six runs |"
            echo "|---|---|"
            echo "| yt-dlp_linux, the single file | $single |"
            echo "| yt-dlp_linux.zip, unpacked ($program) | $zipped |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          median="$(echo "$single" | tr ' ' '\n' | tail -n 5 | sort -n | sed -n 3p)"
          if ! awk -v m="$median" 'BEGIN { exit !(m < 2) }'; then
            echo "yt-dlp_linux takes $median s to start: install yt-dlp_linux.zip unpacked on Linux, as macOS does (#245)" >&2
            exit 1
          fi
