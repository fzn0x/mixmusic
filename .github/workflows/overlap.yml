name: Overlap

# A pull request that conflicts with another open one conflicts with main
# once the other merges, and two that pass alone can fail together. This
# check merges the pull request with each of the other open ones, while
# both are open, and where both change Go code, vets the packages either
# changes and runs the tests of those both change, so that the one pushed
# last makes room before either merges. tools/overlap tells how.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # A merge queue asks every required check of what it merges: there's
  # nothing to compare then, and the job is skipped.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: overlap-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  overlap:
    name: Merges with the other pull requests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Fetch the other open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          THIS: ${{ github.event.pull_request.number }}
        run: |
          # Again if GitHub doesn't answer. The checkout is the pull
          # request's: one from before retry.sh asks once.
          retry() {
            if [ -f .github/scripts/retry.sh ]; then
              bash .github/scripts/retry.sh 45 "$@"
            else
              "$@"
            fi
          }
          retry gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,isDraft \
            --jq ".[] | select(.isDraft | not) | select(.number != $THIS) | .number" > "$RUNNER_TEMP/others"
          while read -r n; do
            retry git fetch -q origin "+refs/pull/$n/head:refs/overlap/$n"
          done < "$RUNNER_TEMP/others"
      # Go's modules, again if a download breaks off. setup-go's cache has
      # them, unless go.sum changed.
      - name: Go's modules
        run: bash .github/scripts/retry.sh 45 go mod download
      - name: Merge with each of them
        # bash itself, not the default bash -e: with pipefail, the step
        # fails when the tool does, not only when tee does.
        shell: bash
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          args=()
          while read -r n; do args+=("#$n=refs/overlap/$n"); done < "$RUNNER_TEMP/others"
          # A test that fails now and then runs again, as in CI's Go jobs.
          go run ./tools/overlap -build -test "go run ./tools/gotest" -base "$BASE" -head HEAD "${args[@]}" |
            tee -a "$GITHUB_STEP_SUMMARY"
