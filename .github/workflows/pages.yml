name: Pages

# Builds the site in site/ with Zola, in flake.nix's shell, and publishes it
# to GitHub Pages whenever what it is built from changes on main: the site,
# and the docs, which tools/sitedocs makes its /docs/ pages of.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/sitedocs/**"
      - "go.mod"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Go and Zola, at the versions flake.lock pins.
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - uses: actions/configure-pages@v6
      - name: The docs' pages, from docs/*.md
        run: nix develop --command go run ./tools/sitedocs
      - name: Build the site
        run: nix develop --command zola --root site build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
      - id: deployment
        uses: actions/deploy-pages@v5
