name: Pages

# Builds the site in site/ with Zola, in flake.nix's shell, and publishes it
# to GitHub Pages whenever what it is built from changes on main: the site,
# and the docs, which tools/sitedocs makes its /docs/ pages of. Those are
# docs/ and the root's Markdown files that name their place, as
# CONTRIBUTING.md does: tools/sitedocs's tests check that the paths below
# list each of those.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "CONTRIBUTING.md"
      - "CODE_OF_CONDUCT.md"
      - "SECURITY.md"
      - "tools/sitedocs/**"
      - "tools/sitefinish/**"
      - "go.mod"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Each push runs to its end, so that every commit on main shows how it
# went: one whose commit is no longer main's newest builds and deploys
# nothing, leaving that to the newer one's run. A shared concurrency group
# would have GitHub cancel the runs waiting in it, which shows as failed.
concurrency:
  group: pages-${{ github.sha }}
  cancel-in-progress: false

jobs:
  newest:
    name: Main's newest commit
    # Only a push can be behind a newer one.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@v7
        with:
          # newest.sh reads this workflow's on.push.paths.
          sparse-checkout: |
            .github/scripts
            .github/workflows
      - id: newest
        run: bash .github/scripts/newest.sh

  deploy:
    needs: newest
    # A run started by hand goes on without that check.
    if: ${{ !cancelled() && needs.newest.result != 'failure' && needs.newest.outputs.newest != 'false' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # Go and Zola, at the versions flake.lock pins.
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - uses: actions/configure-pages@v6
      - name: The docs' pages, from docs/*.md and its folders
        run: nix develop --command go run ./tools/sitedocs
      # The star count at this deploy (site/data/stars.json), which the top
      # bar shows when GitHub's API doesn't answer a visitor's browser
      # (static/stars.js). Without it the site still goes out, without
      # that fallback.
      - name: The star count
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY" --jq '{count: .stargazers_count}' > site/data/stars.json || rm -f site/data/stars.json
      - name: Build the site
        run: nix develop --command zola --root site build
      # The landing page in each language, the sitemap's alternates, and
      # llms.txt for AI agents (tools/sitefinish).
      - name: Finish the site
        run: nix develop --command go run ./tools/sitefinish
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/public
      # Main may have moved on while the site built.
      - id: still
        name: Still main's newest commit
        run: bash .github/scripts/newest.sh
      - id: deployment
        if: steps.still.outputs.newest == 'true'
        uses: actions/deploy-pages@v5
