name: Site pages

# Loads the built website in Chromium, Firefox and WebKit, at a phone's and a
# desktop's width, and fails on console errors, failed requests, sideways
# scrolling, images without an alt and accessibility violations (axe). One
# run in the light theme and one with reduced motion go with them. The
# checks are in site/e2e; they and their libraries are for CI only, and
# nothing of them ships to visitors.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "tools/sitedocs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/site-pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - "tools/sitedocs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/site-pages.yml"

permissions:
  contents: read

jobs:
  pages:
    name: Site pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Zola and Go, at the versions flake.lock pins.
      - uses: ./.github/actions/install-nix
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      # The shell's tools, fetched once, again if a download breaks off.
      - name: The Nix shell
        run: bash .github/scripts/nix-retry.sh nix develop --command true
      - run: nix develop --command go run ./tools/sitedocs
      # Built for the address the checks' server listens on, as the site's
      # links are absolute.
      - name: Build the site
        run: nix develop --command zola --root site build --base-url http://127.0.0.1:4173
      # Playwright installs the browsers' libraries with apt, from the lists
      # it finds. On 2026-11-11 the runners' own mirror went unanswered over
      # HTTP for hours, and Playwright's apt waited on it until cancelled. So
      # apt-install.sh, given no packages, first points the lists at a
      # mirror that answers over HTTPS. While none does, it says so, and the
      # pages' checks skip.
      - name: A mirror of Ubuntu's archive
        run: bash .github/scripts/apt-install.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/e2e/package-lock.json
      - name: Install the checks
        working-directory: site/e2e
        run: npm ci
      - name: Install the browsers
        if: env.APT_SKIPPED != '1'
        timeout-minutes: 60
        working-directory: site/e2e
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Check the pages
        if: env.APT_SKIPPED != '1'
        working-directory: site/e2e
        run: npx playwright test
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: site-pages-report
          path: |
            site/e2e/playwright-report
            site/e2e/test-results
          retention-days: 7
