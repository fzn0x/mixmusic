<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MixMusic's music video</title>
    <!--
      The picture of the music video that plays, muted, on the now playing
      page of MixMusic's main window: MyGo draws no video, so this page
      shows it in a web view there, in place of the cover. MixMusic plays
      the sound itself, and the Go side (video.go, in the root package)
      calls window.mv, of video.js, to load the picture and keep it in time
      with the sound. The native interface paints a box over the page, which
      takes the pointer and the keyboard: nothing here is to be clicked.
    -->
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        user-select: none;
        pointer-events: none;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video muted playsinline disablepictureinpicture disableremoteplayback></video>
    <script src="video.js"></script>
  </body>
</html>
