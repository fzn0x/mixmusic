<script>
    // The docs' drawer, which a narrow window opens over the page as a
    // modal; a copy button on each block of code; and the section of the
    // page in view, lit in "On this page".
    (() => {
      const d = document;
      const root = d.documentElement;
      const drawer = d.querySelector("[data-drawer]");
      const opener = d.querySelector("[data-drawer-open]");
      const narrow = matchMedia("(max-width: 899.98px)");
      const outside = () => [d.querySelector(".docs-main"), d.querySelector(".toc"), d.querySelector("[data-topbar]"), d.querySelector(".footer")].filter(Boolean);
      let back = null;
      const show = (open) => {
        root.classList.toggle("drawer-open", open);
        opener?.setAttribute("aria-expanded", String(open));
        outside().forEach((el) => (el.inert = open));
        if (open) {
          back = d.activeElement;
          drawer.setAttribute("role", "dialog");
          drawer.setAttribute("aria-modal", "true");
          (drawer.querySelector("[aria-current=page]") || drawer.querySelector("a")).focus();
        } else {
          drawer.removeAttribute("role");
          drawer.removeAttribute("aria-modal");
          back?.focus();
          back = null;
        }
      };
      opener?.addEventListener("click", () => show(true));
      d.querySelectorAll("[data-drawer-close]").forEach((el) => el.addEventListener("click", () => show(false)));
      drawer?.addEventListener("click", (e) => {
        if (narrow.matches && e.target.closest("a")) show(false);
      });
      d.addEventListener("keydown", (e) => {
        if (e.key === "Escape" && root.classList.contains("drawer-open")) show(false);
      });
      narrow.addEventListener("change", () => root.classList.contains("drawer-open") && show(false));

      // Copy buttons.
      d.querySelectorAll(".prose pre").forEach((pre) => {
        if (!navigator.clipboard) return;
        const b = d.createElement("button");
        b.type = "button";
        b.className = "icon-btn copy";
        b.setAttribute("aria-label", "Copy the code");
        b.innerHTML = '<svg class="icon" width="20" height="20" aria-hidden="true"><use href="#i-copy" /></svg>';
        b.addEventListener("click", () => {
          navigator.clipboard.writeText(pre.querySelector("code")?.innerText ?? pre.innerText).then(() => {
            b.classList.add("is-done");
            b.setAttribute("aria-label", "Copied");
            b.querySelector("use").setAttribute("href", "#i-check");
            setTimeout(() => {
              b.classList.remove("is-done");
              b.setAttribute("aria-label", "Copy the code");
              b.querySelector("use").setAttribute("href", "#i-copy");
            }, 1600);
          });
        });
        const wrap = d.createElement("div");
        wrap.className = "code";
        pre.replaceWith(wrap);
        wrap.append(pre, b);
      });

      // On this page: the last heading above the top third of the window.
      const toc = d.querySelector("[data-toc]");
      if (toc && "IntersectionObserver" in window) {
        const links = new Map([...toc.querySelectorAll("a")].map((a) => [decodeURIComponent(a.hash.slice(1)), a]));
        const heads = [...links.keys()].map((id) => d.getElementById(id)).filter(Boolean);
        const mark = () => {
          let on = heads[0];
          for (const h of heads) if (h.getBoundingClientRect().top < innerHeight / 3) on = h;
          links.forEach((a, id) => (id === on?.id ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current")));
        };
        let ticking = false;
        addEventListener("scroll", () => {
          if (ticking) return;
          ticking = true;
          requestAnimationFrame(() => {
            ticking = false;
            mark();
          });
        }, { passive: true });
        mark();
      }
    })();
  </script>
